<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acerte no Carro | Painel Comparativo</title>

<style>
:root{
--bg:#0f0f0f;
--card:#1a1a1a;
--orange:#ff7b00;
--orange2:#ff9d2e;
--text:#ffffff;
--line:#2f2f2f;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
padding:30px 15px;
}

.container{
max-width:1100px;
margin:auto;
}

header{
text-align:center;
margin-bottom:30px;
}

.logo{
font-size:38px;
font-weight:900;
color:var(--orange);
}

.sub{
color:#ccc;
margin-top:10px;
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:16px;
padding:20px;
margin-bottom:20px;
}

h2{
margin-bottom:15px;
color:var(--orange2);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:12px;
}

input{
width:100%;
padding
